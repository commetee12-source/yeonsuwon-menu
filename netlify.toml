# 빌드 없는 정적 사이트. 저장소 내용을 그대로 배포한다.
[build]
  publish = "."

# publish = "." 이므로 저장소의 모든 파일이 서빙된다.
# 사이트 구성요소가 아닌 개발용 파일은 공개하지 않는다.
[[redirects]]
  from = "/scripts/*"
  to = "/404-not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404-not-found"
  status = 404
  force = true

# 식단 데이터는 주 1회 갱신되므로 짧게 캐시한다.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# 앱 코드와 진입 문서는 항상 최신을 받도록 한다.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
