<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf7f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1512" media="(prefers-color-scheme: dark)">
<meta name="description" content="서울특별시교육청교육연수원 구내식당 식단 조회">
<title>서울교육연수원 주간 식단</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11h18a9 9 0 0 1-18 0Z"/>
      <path d="M2 11h20" stroke-linecap="round"/>
      <path d="M8.5 7.5c0-1.4 1.6-1.6 1.6-3M13 6.8c0-1.1 1.3-1.3 1.3-2.4" stroke-linecap="round"/>
    </svg>
    <h1>서울교육연수원 식단</h1>
  </div>
  <button type="button" id="todayBtn" class="today-btn">오늘</button>
</header>

<nav class="datebar" aria-label="날짜 선택">
  <div class="date-row">
    <button type="button" id="prevBtn" class="nav-btn" aria-label="하루 전">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="date-field">
      <svg class="cal-ic" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
        <path d="M3.5 9.5h17M8 3.5V6M16 3.5V6" stroke-linecap="round"/>
      </svg>
      <span id="dateLabel" class="date-label">—</span>
      <input type="date" id="dateInput" aria-label="날짜 직접 선택">
    </div>

    <button type="button" id="nextBtn" class="nav-btn" aria-label="하루 뒤">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p id="todayBadge" class="today-badge" hidden>오늘</p>
</nav>

<main id="main" aria-live="polite" aria-busy="true">
  <p class="state-msg">불러오는 중…</p>
</main>

<footer class="footer">
  <p>※ 기관 사정에 따라 변경될 수 있음</p>
  <p class="src">서울특별시교육청교육연수원 주간업무보고 기준</p>
</footer>

<script src="app.js"></script>
</body>
</html>
