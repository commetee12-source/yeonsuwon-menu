<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="서울특별시교육청교육연수원 구내식당 식단 조회">

<body>

  <button type="button" id="nextBtn" class="nav-btn" aria-label="하루 뒤">›</button>
</nav>

<main id="main" aria-live="polite" aria-busy="true">
  <p class="state-msg">불러오는 중…</p>
</main>

<footer class="footer">
  <p>※ 기관 사정에 따라 변경될 수 있음</p>

<script src="app.js"></script>
